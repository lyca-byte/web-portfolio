
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050807">
  <meta
    name="description"
    content="Professional, laboratory, and organizational experience."
  >

  <title>Experience | darla's portfolio</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/experience.css">

  <script src="../js/matrix.js" defer></script>
  <script src="../js/experience.js" defer></script>
</head>

<body>
  <canvas id="matrix-canvas" aria-hidden="true"></canvas>
  <div class="matrix-vignette" aria-hidden="true"></div>

  <main class="stage">
    <section
      class="terminal experience-terminal"
      aria-label="Experience"
    >
      <!-- Terminal title bar -->
      <div class="terminal-topbar">
        <div class="window-controls" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>

        <span class="terminal-title">
          guest@portfolio: ~/experience
        </span>

        <span class="topbar-status">
          <span class="status-dot"></span> ONLINE
        </span>
      </div>

      <!-- Scrollable page content -->
      <div class="terminal-body experience-body">
        <nav
          class="page-navigation"
          aria-label="Page navigation"
        >
          <a class="back-button"
             href="../index.html?skipWelcome=1">
            <span aria-hidden="true">←</span>
            Back to Home
          </a>

          <span class="current-path">~/experience</span>
        </nav>

        <div class="system-label">
          PERSONAL PORTFOLIO <span>EXPERIENCE</span>
        </div>

        <header class="page-header">
          <h1 class="page-title">
            Work &amp; <span class="accent">Experience</span>
          </h1>

          <p class="page-intro">
            A selection of my professional, laboratory, and
            organizational experiences.
          </p>
        </header>

        <div class="experience-section-label">
          <span>EXPERIENCE_LOG</span>
          <span id="experience-count">LOADING...</span>
        </div>

        <!-- Cards and image carousels are generated by experience.js -->
        <section
          id="experience-list"
          class="experience-list"
          aria-label="Experience entries"
          aria-live="polite"
        >
          <p class="experience-loading">
            Loading experience entries...
          </p>
        </section>

        <footer class="page-footer">
          <span class="footer-note">END OF EXPERIENCE.LOG</span>
          <a class="footer-link" href="../index.html?skipWelcome=1">
            Return home ↵
          </a>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
